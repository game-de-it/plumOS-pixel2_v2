input_driver = "udev"
input_device = "gkd-pixel2-joypad"

# Linux joydev button order for the gpio-keys controller. This remains a
# hardware validation gate until every physical control is exercised.
input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "3"
input_y_btn = "4"
input_l_btn = "6"
input_r_btn = "7"
input_l2_btn = "8"
input_r2_btn = "9"
input_select_btn = "10"
input_start_btn = "11"
input_up_btn = "12"
input_down_btn = "13"
input_left_btn = "14"
input_right_btn = "15"
