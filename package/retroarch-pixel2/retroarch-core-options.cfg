# plumOS Pixel2 low-overhead Flycast baseline.
reicast_cpu_mode = "dynamic_recompiler"
reicast_enable_dsp = "disabled"
reicast_anisotropic_filtering = "1"
reicast_internal_resolution = "640x480"
reicast_threaded_rendering = "enabled"
reicast_synchronous_rendering = "disabled"
reicast_delay_frame_swapping = "disabled"
reicast_frame_skipping = "disabled"
reicast_pvr2_filtering = "disabled"
reicast_texupscale = "1"

# Pixel2 Parallel-N64 baseline. Mutable user values always take precedence.
parallel-n64-gfxplugin = "gliden64"
parallel-n64-rspplugin = "hle"
parallel-n64-screensize = "640x480"

# km_mame2003_xtreme defaults TurboBoost to X6, which deliberately drops six
# of every twelve video frames. Pixel2 can sustain the full CPS1 refresh rate,
# so keep frameskip disabled unless the user explicitly selects another value.
mame2003-xtreme-amped-turboboost = "disabled"

# NP2kai defaults this to OFF, which leaves keyboard-driven PC-98 content
# unresponsive even though RetroArch receives the Pixel2 RetroPad. Match the
# proven plumOS handheld policy: D-pad becomes PC-98 cursor keys, face buttons
# use the three-button keyboard profile, Select is Escape and Start is Return.
# The config merge adds this only when the user has not selected another mode.
np2kai_joymode = "Arrows 3button"
