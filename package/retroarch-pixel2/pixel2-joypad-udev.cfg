input_driver = "udev"
input_device = "pixel2_joypad"
input_vendor_id = "0"
input_product_id = "0"

# Pixel2 joypad mapping for RetroArch's udev joypad driver.
#
# The stock RK3326 kernel exposes the D-pad as ABS_X/ABS_Y axes and the face /
# shoulder / menu buttons as evdev keys. RetroArch's udev driver maps those keys
# to compact button indices in scan order:
#
#   BTN_SOUTH=0 (physical B), BTN_EAST=1 (physical A),
#   BTN_NORTH=2, BTN_WEST=3,
#   BTN_TL=4, BTN_TR=5, BTN_TL2=6, BTN_TR2=7,
#   BTN_SELECT=8, BTN_START=9, BTN_TRIGGER_HAPPY1=10.
input_a_btn = "1"
input_b_btn = "0"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_left_axis = "-0"
input_right_axis = "+0"
input_up_axis = "-1"
input_down_axis = "+1"
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
